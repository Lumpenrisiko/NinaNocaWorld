  <!-- Highlights -->
  <ellipse cx="19" cy="22" rx="6" ry="3.5" fill="#fff" opacity="0.55"/>
  <ellipse cx="17.5" cy="20.5" rx="2.2" ry="1.3" fill="#fff" opacity="0.95"/>

